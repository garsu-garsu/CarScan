name: Internal test release

# Builds the signed AAB that goes to Play's internal testing track.
#
# Fire it by hand (Actions → this workflow → Run workflow) for an ordinary internal-test
# update, or push a `v*` tag when a build is worth a permanent GitHub Release.
#
# ---------------------------------------------------------------------------------------------
# Repository secrets this needs (Settings → Secrets and variables → Actions):
#
#   RELEASE_KEYSTORE_BASE64   the upload keystore, base64-encoded:
#                               base64 -w0 upload.jks          (Linux/Git Bash)
#                               certutil -encode upload.jks o  (Windows, strip the header lines)
#   RELEASE_STORE_PASSWORD    keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password
#   MAPS_API_KEY              Google Maps SDK key — without it the trip-detail map draws blank
#                             tiles (it does not crash)
#   ADMOB_APP_ID              ca-app-pub-…~…
#   ADMOB_BANNER_AD_UNIT      ca-app-pub-…/…
#   ADMOB_INTERSTITIAL_AD_UNIT
#   ADMOB_APPOPEN_AD_UNIT
#
# Optional — only once a Play service account exists:
#   PLAY_SERVICE_ACCOUNT_JSON the service-account JSON, whole file. Absent, the upload step
#                             skips itself and the AAB is still downloadable from this run.
#
# An AdMob secret left unset is simply omitted from local.properties, and the build falls back
# to Google's public TEST ad unit. That is the safe failure: a test ad shows, and the real ad
# account is never at risk of a self-click ban.
# ---------------------------------------------------------------------------------------------
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # For the GitHub Release step below. Nothing else here writes to the repo.
    permissions:
      contents: write

    env:
      # Hoisted to the job so the publish step can ask whether it is set before running.
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The release build reads all of this from a gitignored `local.properties`. On CI it does
      # not exist, so it is written here from secrets and shredded again at the end of the job.
      #
      # A blank secret is OMITTED rather than written blank: the build falls back only on a
      # *missing* key, so `admob.app.id=` would ship an empty app id and AdMob would refuse to
      # initialise at runtime.
      - name: Write local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT: ${{ secrets.ADMOB_BANNER_AD_UNIT }}
          ADMOB_INTERSTITIAL_AD_UNIT: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT }}
          ADMOB_APPOPEN_AD_UNIT: ${{ secrets.ADMOB_APPOPEN_AD_UNIT }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : > local.properties
          put() { [ -n "$2" ] && echo "$1=$2" >> local.properties; return 0; }
          put maps.api.key "$MAPS_API_KEY"
          put admob.app.id "$ADMOB_APP_ID"
          put admob.banner.adunit "$ADMOB_BANNER_AD_UNIT"
          put admob.interstitial.adunit "$ADMOB_INTERSTITIAL_AD_UNIT"
          put admob.appopen.adunit "$ADMOB_APPOPEN_AD_UNIT"
          put release.storeFile upload.jks
          put release.storePassword "$RELEASE_STORE_PASSWORD"
          put release.keyAlias "$RELEASE_KEY_ALIAS"
          put release.keyPassword "$RELEASE_KEY_PASSWORD"

      # `release.storeFile` is resolved against the repo root — see androidApp/build.gradle.kts.
      # Without it the build would silently fall back to the local debug keystore, which Play
      # rejects, so this fails loudly instead.
      - name: Restore upload keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set — the AAB could not be signed with the upload key."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > upload.jks

      # Same gate CI runs. A release that skips the tests is how a broken internal build reaches
      # a tester's car.
      - name: Test
        run: ./gradlew check -x lint --stacktrace

      # Play refuses an upload whose versionCode it has already seen, and `run_number` only ever
      # goes up. The +100 offset clears the hand-built versionCodes already uploaded from a
      # laptop (versionCode 1 went to internal testing on 2026-08-28), so the first CI build is
      # 101 and no manual upload can ever collide with a CI one.
      #
      # versionName comes from the tag when there is one, so a `v1.0.1` tag ships as 1.0.1
      # without editing the build file.
      - name: Bundle release AAB
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME_ARG="-PversionName=${GITHUB_REF_NAME#v}"
          else
            NAME_ARG=""
          fi
          ./gradlew :androidApp:bundleRelease \
            -PversionCode=$(( 100 + ${{ github.run_number }} )) $NAME_ARG --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: carscan-release-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          retention-days: 30

      # The FIRST upload of this app has to go through the Play Console by hand — that is what
      # enrols it in Play App Signing and creates the internal testing track. From the second one
      # on, this step does it, if a service account has been created and its JSON stored as
      # PLAY_SERVICE_ACCOUNT_JSON. Without the secret it skips, and the artifact above is still
      # there to upload manually.
      - name: Publish to Play internal testing
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bruni.carscan
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Attach the AAB to a GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/bundle/release/*.aab

      # The keystore and the passwords must not survive the job, even on failure.
      - name: Shred secrets
        if: always()
        run: rm -f upload.jks local.properties
